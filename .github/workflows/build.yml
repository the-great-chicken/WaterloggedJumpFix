name: Build and release plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build versioned JAR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          verify-signature: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read and validate SemVer
        id: version
        shell: bash
        run: |
          version="$(./gradlew --no-daemon --quiet printVersion)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: ./gradlew --no-daemon clean check jar

      - name: Verify versioned JAR
        shell: bash
        run: test -f "build/libs/WaterloggedJumpFix-${{ steps.version.outputs.version }}.jar"

      - name: Upload versioned JAR
        uses: actions/upload-artifact@v7
        with:
          name: WaterloggedJumpFix-${{ steps.version.outputs.version }}
          path: build/libs/WaterloggedJumpFix-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 90